<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portafolio</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: sans-serif; background: #fff; color: #111; }

  header {
    padding: 2rem;
    border-bottom: 1px solid #eee;
  }
  header h1 { font-size: 1.3rem; font-weight: 600; }
  header p { font-size: 0.85rem; color: #777; margin-top: 0.25rem; }

  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 1rem;
    padding: 2rem;
  }

  .photo {
    overflow: hidden;
    background: #f5f5f5;
    cursor: pointer;
  }

  .photo img {
    width: 100%;
    aspect-ratio: 4/3;
    object-fit: cover;
    display: block;
    transition: transform 0.3s ease;
  }
  .photo:hover img { transform: scale(1.05); }

  .photo-caption {
    padding: 0.5rem 0.75rem;
    font-size: 0.8rem;
    color: #555;
  }

  /* Lightbox */
  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 999;
    align-items: center;
    justify-content: center;
  }
  .lightbox.open { display: flex; }
  .lightbox img {
    max-width: 90vw;
    max-height: 90vh;
    object-fit: contain;
  }
  .lightbox-close {
    position: fixed;
    top: 1rem; right: 1.5rem;
    color: #fff;
    font-size: 2rem;
    cursor: pointer;
    line-height: 1;
  }

  footer {
    text-align: center;
    padding: 2rem;
    font-size: 0.8rem;
    color: #aaa;
    border-top: 1px solid #eee;
  }
</style>
</head>
<body>

<header>
  <h1>Mi Portafolio</h1>
  <p>Fotografía — Bogotá, Colombia</p>
</header>

<div class="gallery" id="gallery"></div>

<div class="lightbox" id="lightbox">
  <span class="lightbox-close" onclick="closeLightbox()">×</span>
  <img id="lb-img" src="" alt="">
</div>

<footer>© 2026 — hola@mifoto.co</footer>

<script>
const fotos = [
  { src: "https://images.unsplash.com/photo-1531746020798-e6953c6e8e04?w=800&q=80", titulo: "Retrato" },
  { src: "https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=800&q=80", titulo: "Montañas" },
  { src: "https://images.unsplash.com/photo-1449824913935-59a10b8d2000?w=800&q=80", titulo: "Ciudad" },
  { src: "https://images.unsplash.com/photo-1500964757637-c85e8a162699?w=800&q=80", titulo: "Amanecer" },
  { src: "https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=800&q=80", titulo: "Mirada" },
  { src: "https://images.unsplash.com/photo-1518098268026-4e89f1a2cd8e?w=800&q=80", titulo: "Selva" },
  { src: "https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?w=800&q=80", titulo: "Skyline" },
  { src: "https://images.unsplash.com/photo-1490750967868-88df5691cc33?w=800&q=80", titulo: "Flores" },
  { src: "https://images.unsplash.com/photo-1518173946687-a4c8892bbd9f?w=800&q=80", titulo: "Mar" },
];

const gallery = document.getElementById('gallery');
fotos.forEach(f => {
  const div = document.createElement('div');
  div.className = 'photo';
  div.innerHTML = `<img src="${f.src}" alt="${f.titulo}" loading="lazy"><div class="photo-caption">${f.titulo}</div>`;
  div.onclick = () => {
    document.getElementById('lb-img').src = f.src;
    document.getElementById('lightbox').classList.add('open');
  };
  gallery.appendChild(div);
});

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
}
document.getElementById('lightbox').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeLightbox();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });
</script>
</body>
</html>
